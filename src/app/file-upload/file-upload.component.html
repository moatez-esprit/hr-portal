<p>file-upload works!</p>
<div class="file-upload-container">
  <div class="upload-zone" [class.dragover]="isDragOver" 
       (dragover)="onDragOver($event)" 
       (dragleave)="onDragLeave($event)"
       (drop)="onDrop($event)"
       (click)="fileInput.click()">
    
    <input #fileInput type="file" (change)="onFileChange($event)" 
           [accept]="acceptedTypes" style="display: none;">
    
    <div class="upload-content">
      <mat-icon class="upload-icon">cloud_upload</mat-icon>
      <h4>Glissez-déposez votre fichier ici</h4>
      <p>ou cliquez pour sélectionner</p>
      <small>Formats acceptés: PDF, DOC, DOCX (max 5MB)</small>
    </div>
  </div>
  
  <div class="file-info" *ngIf="selectedFile">
    <mat-icon>description</mat-icon>
    <span>{{ selectedFile.name }}</span>
    <button mat-icon-button (click)="removeFile()">
      <mat-icon>close</mat-icon>
    </button>
  </div>
</div>
